; LingoInk — offline language trainer firmware for Xteink X4 (ESP32-C3)
; Build:      pio run -e esp32c3
; Flash app:  pio run -e esp32c3 -t upload      (or esptool write_flash 0x10000 firmware.bin)
; Monitor:    pio device monitor -e esp32c3

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE
    -DFREEINK_DEVICE_X4=1
    -DFREEINK_DEVICE_X3=1
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Fast-DU partial refresh (~85ms, the 0x1C path CrossPoint uses on this
    ; exact panel) instead of the stock 0xFC sequence that ghosts on some units.
    -DFREEINK_X4_FAST_DU_SHORTCUT
    -Os
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_src_filter =
    +<*.cpp>
    +<app/>
    +<course/>
    +<exercises/>
    +<input/>
    +<progress/>
    +<screens/>
    +<srs/>
    +<ui/>

; Desktop build of the domain layer (scheduler, parser, mastery) for tests.
; Needs a host C++ toolchain (gcc/clang). Run: pio test -e native
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DPLATFORM_NATIVE
    -Isrc
    -Ilib/ArduinoJson/src
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_src_filter =
    +<course/LessonLoader.cpp>
    +<srs/>
test_build_src = true
